<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Atomic texture replacement</title>
        <style>
            body {
                margin: 0;
                background: #15202b;
                color: white;
                font: 16px sans-serif;
            }
            canvas {
                display: block;
                width: 100vw;
                height: 75vh;
            }
            section {
                padding: 12px;
            }
            button,
            input,
            a {
                margin-right: 12px;
            }
            a {
                color: #9df;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <canvas id="GameCanvas" tabindex="0"></canvas>
        <section>
            <label>Paper color <input id="paper" type="color" value="#77aaff" /></label
            ><label>Import image <input id="import" type="file" accept="image/*" /></label
            ><button id="close">Close</button><a href="">Reload</a>
            <p id="status">Paper edits preserve imported artwork.</p>
        </section>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
