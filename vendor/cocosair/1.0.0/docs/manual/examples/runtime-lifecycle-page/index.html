<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Lifecycle and two-sided page</title>
        <style>
            body {
                margin: 0;
                background: #15202b;
                color: white;
                font: 16px sans-serif;
            }
            canvas {
                display: block;
                width: 100vw;
                height: 75vh;
            }
            section {
                padding: 12px;
            }
            button,
            input,
            a {
                margin-right: 12px;
            }
            a {
                color: #9df;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <canvas id="GameCanvas" tabindex="0"></canvas>
        <section>
            <label>Turn <input id="angle" type="range" min="0" max="180" value="0" disabled /></label
            ><button id="audio" disabled>Play tone</button><button id="close">Close, also during loading</button
            ><a href="">Full reload</a>
            <p id="status">Loading for one second. Front is orange; back is blue.</p>
        </section>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
