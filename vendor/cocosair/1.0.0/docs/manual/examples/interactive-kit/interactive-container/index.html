<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><link
        rel="icon"
        href="data:,"
    /><title>容器就绪与隐藏恢复</title>
    <script type="importmap">
        {
            "imports": {
                "cocosair": "/build/cocosair.module.js"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #111c2c;
            color: #edf3fc;
            font: 16px/1.6 system-ui;
        }
        main {
            padding: 24px;
        }
        button {
            font: inherit;
            padding: 8px 12px;
            margin: 4px;
        }
        #parent {
            width: 700px;
            max-width: 100%;
            height: 320px;
        }
        #parent.narrow {
            width: 430px;
            height: 260px;
        }
        #parent.wide {
            width: 760px;
            height: 340px;
        }
        #host,
        #GameDiv,
        #Cocos3dGameContainer,
        #GameCanvas {
            width: 100%;
            height: 100%;
        }
        #GameCanvas {
            display: block;
            touch-action: none;
        }
        #host.hidden {
            display: none;
        }
        #host.loading-hidden {
            visibility: hidden;
        }
        #report,
        #compare {
            display: none;
            padding: 24px;
            background: #23374b;
        }
        #state {
            white-space: pre-wrap;
        }
    </style>
    <body>
        <main>
            <h1>非零容器就绪后启动</h1>
            <p>
                最初隐藏；显示后等待原生布局、相机和提交，截图另证可见。页面不写 screen.windowSize，也没有应用 resize
                尺寸 workaround。
            </p>
            <div>
                <button id="run">Run</button><button id="report-tab">Report</button
                ><button id="compare-tab">Compare</button><button id="narrow">窄布局</button
                ><button id="wide">宽布局</button><button id="hide">隐藏</button><button id="show">显示</button
                ><button id="release">Release</button>
            </div>
            <div id="parent">
                <div id="host" class="hidden">
                    <div id="GameDiv">
                        <div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="0"></canvas></div>
                    </div>
                </div>
            </div>
            <section id="report">原始布局记录；不是 Puzzle50 原反例。</section>
            <section id="compare">旧代次结果不得改写当前页。</section>
            <pre id="state">等待 Run</pre>
        </main>
        <script type="module">
            if (new URLSearchParams(location.search).get('control') === 'webgl') await import('./src/control.ts');
            else await import('./src/main.ts');
        </script>
    </body>
</html>
