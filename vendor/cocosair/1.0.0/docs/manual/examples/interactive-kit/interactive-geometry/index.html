<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>IER-04 · Dynamic Mesh &amp; Projection</title>
        <link rel="icon" href="data:," />
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                background: #0b0d12;
                color: #cfd6e4;
                font:
                    13px/1.5 system-ui,
                    sans-serif;
            }
            /* The canvas fills the viewport so the engine adapter, the CSS rect and the camera
           aspect always agree after a real window resize (no fixed 640x400 style). */
            #stage {
                margin: 0;
            }
            #GameCanvas {
                width: 100vw;
                height: 100vh;
                display: block;
                background: #10131a;
                touch-action: none;
            }
            #stage.offset {
                margin-left: 72px;
                margin-top: 40px;
            } /* container offset case */
            #controls {
                position: fixed;
                left: 8px;
                right: 8px;
                bottom: 8px;
                z-index: 2;
                display: flex;
                gap: 8px;
            }
            button {
                flex: 1;
                padding: 6px 0;
                background: #1b2230;
                color: #e6ebf5;
                border: 1px solid #2c3648;
                border-radius: 4px;
                cursor: pointer;
            }
            button:hover {
                background: #243048;
            }
            #status {
                margin-top: 8px;
                color: #8fa0bd;
                text-align: center;
            }
            .hidden {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="stage">
            <canvas id="GameCanvas"></canvas>
            <div id="controls">
                <button id="reset">Reset</button>
                <button id="release">Release</button>
            </div>
            <div id="status">loading…</div>
        </div>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
