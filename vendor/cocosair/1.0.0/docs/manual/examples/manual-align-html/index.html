<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>Aligning HTML Elements to 3D — HTML 元素对齐 3D（docs/manual/align-html-elements-to-3d.md）</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #fff;
            }
            #GameDiv {
                width: 100%;
                height: 100%;
                position: relative;
            }
            #Cocos3dGameContainer {
                width: 100%;
                height: 100%;
            }
            #GameCanvas {
                width: 100%;
                display: block;
                height: 100%;
            }
            #info {
                position: absolute;
                left: 8px;
                top: 8px;
                z-index: 10;
                font:
                    12px/1.6 ui-monospace,
                    Consolas,
                    monospace;
                color: #e8eef7;
                background: rgba(10, 16, 26, 0.78);
                padding: 6px 10px;
                border-radius: 4px;
                white-space: pre;
            }
            .tag {
                position: absolute;
                z-index: 9;
                left: 0;
                top: 0;
                font:
                    12px/1 ui-monospace,
                    Consolas,
                    monospace;
                color: #0b1018;
                padding: 3px 8px;
                border-radius: 10px;
                transform: translate(-50%, -50%);
                pointer-events: none;
                white-space: pre;
            }
            #tag-orange {
                background: #f2b26b;
            }
            #tag-teal {
                background: #7fd8cf;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <!-- 官方模板 DOM 结构：pal/screen-adapter 依赖这些 id 做全屏适配 -->
        <div id="GameDiv">
            <div id="Cocos3dGameContainer">
                <!-- #GameCanvas 必须在引擎 import 前存在（pal/screen-adapter 为模块顶层单例） -->
                <canvas id="GameCanvas"></canvas>
            </div>
            <div id="tag-orange" class="tag">ORANGE</div>
            <div id="tag-teal" class="tag">TEAL</div>
        </div>
        <div id="info">loading…</div>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
