<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Canvas and HTML focus</title>
        <style>
            body {
                margin: 0;
                background: #15202b;
                color: white;
                font: 16px sans-serif;
            }
            canvas {
                display: block;
                width: 100vw;
                height: 75vh;
            }
            section {
                padding: 12px;
            }
            button,
            input,
            a {
                margin-right: 12px;
            }
            a {
                color: #9df;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <canvas id="GameCanvas" tabindex="0"></canvas>
        <section>
            <p>Click Start or the canvas, then press A. Text input must not trigger actions.</p>
            <button id="start">Start / re-enter</button><button id="leave">Leave</button
            ><button id="hud">Ordinary HUD button</button><input id="text" aria-label="Text field" />
            <p id="status">Waiting for Start.</p>
        </section>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
