<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>cocosair — v12-profiler-overlay</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #fff;
            }
            #GameDiv {
                width: 100%;
                height: 100%;
            }
            #Cocos3dGameContainer {
                width: 100%;
                height: 100%;
            }
            #GameCanvas {
                width: 100%;
                height: 100%;
                display: block;
            }
            #ProfilerBadge {
                position: fixed;
                top: 6px;
                right: 8px;
                font: 12px/1.4 monospace;
                color: #dfe7f3;
                background: rgba(20, 28, 40, 0.72);
                padding: 2px 6px;
            }
        </style>
        <script type="importmap">
            { "imports": { "cocosair": "/build/cocosair.module.js" } }
        </script>
    </head>
    <body>
        <div id="GameDiv">
            <div id="Cocos3dGameContainer">
                <canvas id="GameCanvas"></canvas>
            </div>
        </div>
        <div id="ProfilerBadge"></div>
        <script type="module" src="./main.js"></script>
    <script src="/__bench-prelude.js"></script></body>
</html>
