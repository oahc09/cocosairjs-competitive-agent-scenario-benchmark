<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tiny-fake-app</title>
  <style>
    html, body { margin: 0; padding: 0; background: #0b1020; overflow: hidden; }
    canvas { display: block; width: 1280px; height: 720px; }
    .hud {
      position: fixed; top: 8px; left: 8px; color: #9fe8ff;
      font: 12px/1.5 Consolas, monospace; background: rgba(0, 0, 0, 0.35);
      padding: 4px 8px; border-radius: 4px; pointer-events: none; z-index: 10;
    }
    .controls { position: fixed; top: 8px; right: 8px; display: flex; gap: 8px; z-index: 10; }
    .controls button {
      font: 13px Consolas, monospace; padding: 6px 12px; cursor: pointer;
      background: #1d2a44; color: #d7e6ff; border: 1px solid #3c5580; border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="stage" width="1280" height="720"></canvas>
  <div class="hud" data-bench="hud" id="hud">frame 0 | fps --</div>
  <div class="controls">
    <button data-ui="reset" id="btn-reset" aria-label="reset">Reset</button>
    <button data-bench="ping" id="btn-ping" aria-label="ping">Ping</button>
  </div>
  <script src="dist/app.js"></script>
</body>
</html>
