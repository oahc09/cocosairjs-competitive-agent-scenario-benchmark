<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:#111}#GameCanvas{width:100%;height:100%}</style><script type="importmap">{"imports":{"cocosair.js":"/node_modules/cocosair.js/build/npm/cocosair.module.js"}}</script></head><body><div id="GameDiv"><div id="Cocos3dGameContainer"><canvas id="GameCanvas"></canvas></div></div><script type="module">
import { boot } from './lib.mjs';
// G-QUAD-SIZE:primitives.quad 忽略尺寸选项恒 1×1(E08 实测)
// 同距相机下 2.2 宽与 0.5 宽两个 quad 屏幕投影宽度应显著不同 ⇒ FIXED;几乎相同 ⇒ BUG
const R = await boot();
R.addCamera();
R.addLight(new R.Color(255, 255, 255, 255));
R.mesh(R.primitives.quad({ width: 2.2, height: 2.2 }), R.builtinMat(), new R.Vec3(-0.75, 0, 0));
R.mesh(R.primitives.quad({ width: 0.5, height: 0.5 }), R.builtinMat(), new R.Vec3(0.75, 0, 0));
R.app.run(R.scene);
R.scene.globals.ambient.skyColorHDR.set(0.22, 0.22, 0.25, 1);
R.scene.globals.ambient.skyIllum = 7000;
const img = await R.sample(12);
const row = (img.h / 2) | 0;
let width2 = 0, width1 = 0, inBig = false;
for (let x = 0; x < img.w; x++) {
  const [r] = R.colorAt(img, x, row);
  const lit = r > 40;
  if (lit && !inBig) { inBig = true; width2++; } else if (lit && inBig) width2++; else inBig = false;
}
// 统计两段亮区宽度(取最大两段)
let segs = [], cur = 0;
for (let x = 0; x < img.w; x++) { const [r] = R.colorAt(img, x, row); if (r > 40) { cur++; } else { if (cur) segs.push(cur); cur = 0; } }
if (cur) segs.push(cur);
segs.sort((a, b) => b - a);
const big = segs[0] || 0, small = segs[1] || 0;
const distinct = big > 0 && small > 0 && big / small > 1.8;
R.finish({ outcome: segs.length < 2 ? 'ERROR' : (distinct ? 'FIXED' : 'BUG'), detail: `亮段宽度 px: ${segs.slice(0, 4).join(',')} (同距下应一大一小)` });
</script></body></html>
